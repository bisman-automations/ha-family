<!doctype html>
<!-- Fakes Home Assistant with a sample family, to look at the dashboards
     (and the Family card: mode=card).
     Serve the repo root over HTTP and open
     scripts/panel-preview/index.html?mode=family (or mode=parents). -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { margin: 0; font-family: Roboto, sans-serif; --primary-color: #03a9f4; --primary-background-color: #f5f5f5;
    --card-background-color: #fff; --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: #e0e0e0; }
  body.dark { --primary-background-color: #111; --card-background-color: #1c1c1c; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --divider-color: #333; }
</style></head>
<body>
<script>
const params = new URLSearchParams(location.search);
if (params.get("theme") === "dark") document.body.classList.add("dark");
customElements.define("ha-menu-button", class extends HTMLElement {});
// A stand-in for Home Assistant's icons.
const GLYPHS = { palette: "🎨", lightbulb: "💡", "window-shutter": "🪟", lock: "🔒", "lock-open-variant": "🔓", speaker: "🔊", thermostat: "🌡️", "weather-partly-cloudy": "⛅", "script-text-play": "▶️" };
customElements.define("ha-icon", class extends HTMLElement {
  connectedCallback() { this.textContent = GLYPHS[(this.getAttribute("icon") || "").replace("mdi:", "")] || "•"; this.style.fontSize = "30px"; }
});
const now = Date.now();
const ago = (m) => new Date(now - m * 60000).toISOString();
let members = [
  { id: "a", name: "Alex", emoji: "🦖", color: "#3F51B5", person: "person.alex", points: 42, picture: null, to_check: 1 },
  { id: "b", name: "Sam", emoji: "🦄", color: "#E91E63", person: null, points: 15, picture: null, to_check: 0 },
  { id: "c", name: "Riley", emoji: "", color: "#009688", person: null, points: 8, picture: null, to_check: 0 },
];
let allChores = [
  { id: "bed", name: "Make your bed", emoji: "🛏️", points: 5, repeat: "daily", members: [], enabled: true },
  { id: "dishes", name: "Empty the dishwasher", emoji: "🍽️", points: 10, repeat: "daily", members: ["a", "b"], enabled: true },
  { id: "room", name: "Tidy your room", emoji: "🧸", points: 15, repeat: "weekly", members: ["c"], enabled: true },
];
const todoChores = [{ id: "todo:todo.chores:1", name: "Feed the dog", points: 3, members: [], repeat: "once", enabled: true, source: "todo", list: "Chores" }];
let rewards = [
  { id: "tv30", name: "30 minutes of TV", emoji: "📺", points: 20, kind: "tv_time", tv: "fam", minutes: 30, whole_home: true, tv_name: "Family Room TV" },
  { id: "ice", name: "Ice cream", emoji: "🍦", points: 25, kind: "custom", limit: "daily" },
  { id: "toy", name: "A new toy", emoji: "🎁", points: 100, kind: "custom" },
];
let entries = [
  { id: "e1", at: ago(30), kind: "chore", member: "a", title: "Make your bed", points: 5, review: "pending" },
  { id: "e2", at: ago(200), kind: "reward", member: "b", title: "Ice cream", points: -25, given: "to_give" },
  { id: "e3", at: ago(1500), kind: "chore", member: "c", title: "Feed the dog", points: 3, review: "rejected" },
];
const st = (entity_id, state, attributes) => ({ entity_id, state, attributes: { friendly_name: entity_id, ...attributes } });
let states = {
  "scene.movie_night": st("scene.movie_night", "2026-11-04T19:00:00", { friendly_name: "Movie night" }),
  "light.playroom": st("light.playroom", "on", { friendly_name: "Playroom lights" }),
  "cover.family_room_blinds": st("cover.family_room_blinds", "closed", { friendly_name: "Family room blinds" }),
  "lock.back_door": st("lock.back_door", "locked", { friendly_name: "Back door" }),
  "media_player.kitchen_speaker": st("media_player.kitchen_speaker", "playing", { friendly_name: "Kitchen speaker", media_title: "Happy songs" }),
  "sensor.outside_temperature": st("sensor.outside_temperature", "38", { friendly_name: "Outside", unit_of_measurement: "°F" }),
  "climate.upstairs": st("climate.upstairs", "heat", { friendly_name: "Upstairs" }),
};
const KINDS = { scene: "run", light: "toggle", cover: "open", lock: "lock", media_player: "media", sensor: "view", climate: "view" };
let controls = [
  { id: "k1", entity_id: "scene.movie_night", name: null, emoji: "🍿", members: [], confirm: false },
  { id: "k2", entity_id: "light.playroom", name: null, emoji: null, members: [], confirm: false },
  { id: "k3", entity_id: "cover.family_room_blinds", name: null, emoji: null, members: [], confirm: false },
  { id: "k4", entity_id: "lock.back_door", name: null, emoji: null, members: ["a"], confirm: true },
  { id: "k5", entity_id: "media_player.kitchen_speaker", name: null, emoji: null, members: [], confirm: false },
  { id: "k6", entity_id: "sensor.outside_temperature", name: "Outside", emoji: null, members: [], confirm: false },
  { id: "k7", entity_id: "climate.upstairs", name: null, emoji: null, members: [], confirm: false },
];
const controlList = () => controls.map((c) => ({ ...c, label: c.name || states[c.entity_id]?.attributes.friendly_name || c.entity_id, kind: KINDS[c.entity_id.split(".")[0]] }));
const NEXT = { toggle: { on: "off", off: "on" }, open: { closed: "open", open: "closed" }, lock: { locked: "unlocked", unlocked: "locked" }, media: { playing: "paused", paused: "playing" } };
const setState = (entity_id, state) => {
  states = { ...states, [entity_id]: { ...states[entity_id], state } };
  window.hass = { ...window.hass, states };
  if (window.panel) window.panel.hass = window.hass;
};
const chores = () => [...allChores, ...todoChores].filter((c) => c.enabled).map((c) => ({ ...c, can: c.members.length ? c.members : members.map((m) => m.id) }));
window.calls = [];
let settings = { auto_check: null };
const state = () => ({
  members, chores: chores(), rewards: rewards.map((r) => ({ ...r, used_by: [...new Set(entries.filter((e) => e.kind === "reward" && e.reward_id === r.id && r.limit).map((e) => e.member))] })), settings, undo_seconds: 60, controls: controlList(), recent: [...entries].reverse(), me: null, is_admin: params.get("mode") === "parents",
  all_chores: allChores, todo_lists: [{ id: "todo.chores", entity_id: "todo.chores", name: "Chores", points: 3, members: [], item_points: {}, items: [
    { name: "Feed the dog", points: 3, rated: false, unrated: 3 },
    { name: "Take out the trash", points: 8, rated: true, unrated: 3 },
    { name: "Water the plants", points: 5, rated: false, unrated: 5 },
  ] }],
  to_check: entries.filter((e) => e.review === "pending"), to_give: entries.filter((e) => e.given === "to_give"), history: [...entries].reverse(),
});
window.hass = {
  states, user: { is_admin: true },
  formatEntityState: (s) => ({ on: "On", off: "Off", open: "Open", closed: "Closed", locked: "Locked", unlocked: "Unlocked", playing: "Playing", paused: "Paused", heat: "Heat" }[s.state] ?? `${s.state}${s.attributes.unit_of_measurement || ""}`),
  connection: { subscribeMessage: async () => () => {} },
  callWS: async (msg) => {
    window.calls.push(msg);
    if (msg.type === "lovelace/dashboards/list") return window.dashboards || [];
    if (msg.type === "lovelace/dashboards/create") { (window.dashboards ||= []).push({ url_path: msg.url_path, title: msg.title }); return {}; }
    if (msg.type === "lovelace/config/save") { window.savedDashboard = msg; return null; }
    const t = msg.type.replace("family/", "");
    if (t === "state") return state();
    if (t === "choices") return { people: [{ entity_id: "person.alex", name: "Alex Sample" }, { entity_id: "person.sam", name: "Sam Sample" }, { entity_id: "person.riley", name: "Riley Sample" }], todo_lists: [{ entity_id: "todo.chores", name: "Chores" }, { entity_id: "todo.groceries", name: "Groceries" }], tvs: [{ id: "fam", name: "Family Room TV" }], entities: Object.values(states).map((s) => ({ entity_id: s.entity_id, name: s.attributes.friendly_name, domain: s.entity_id.split(".")[0] })).concat([{ entity_id: "switch.fountain", name: "Garden fountain", domain: "switch" }]) };
    if (t === "control") {
      const c = controlList().find((x) => x.id === msg.control_id);
      if (!c) throw { message: "That isn't on the dashboard any more" };
      const next = NEXT[c.kind]?.[states[c.entity_id].state];
      if (next) setTimeout(() => setState(c.entity_id, next), 300);
      return {};
    }
    if (t === "move") { const i = controls.findIndex((x) => x.id === msg.item_id); const j = Math.max(0, Math.min(controls.length - 1, i + msg.offset)); controls.splice(j, 0, controls.splice(i, 1)[0]); return {}; }
    const m = members.find((x) => x.id === msg.member_id);
    if (t === "complete") { const c = chores().find((x) => x.id === msg.chore_id); m.points += c.points; const e = { id: "n" + entries.length, at: new Date().toISOString(), kind: "chore", member: m.id, chore_id: c.id, title: c.name, points: c.points, review: "pending" }; entries.push(e); return { entry: e, points: m.points }; }
    if (t === "redeem") { const r = rewards.find((x) => x.id === msg.reward_id); if (m.points < r.points) throw { message: `${m.name} needs ${r.points} points for ${r.name}` }; if (r.limit && entries.some((e) => e.reward_id === r.id && e.member === m.id)) throw { message: `${m.name} already had ${r.name} today` }; m.points -= r.points; const e = { id: "n" + entries.length, at: new Date().toISOString(), kind: "reward", member: m.id, reward_id: r.id, title: r.name, points: -r.points, given: r.kind === "tv_time" ? "given" : "to_give" }; entries.push(e); return { entry: e, points: m.points }; }
    if (t === "undo") { const e = entries.find((x) => x.id === msg.entry_id); if (!e) throw { message: "That can't be found any more" }; const mm = members.find((x) => x.id === e.member); mm.points -= e.points; entries = entries.filter((x) => x !== e); return {}; }
    if (t === "settings") { settings = { auto_check: msg.auto_check || null }; return { settings }; }
    if (t === "review") { const e = entries.find((x) => x.id === msg.entry_id); e.review = msg.approved ? "approved" : "rejected"; return {}; }
    if (t === "given") { entries.find((x) => x.id === msg.entry_id).given = "given"; return {}; }
    if (t === "save") { const list = { chores: allChores, rewards, members, controls }[msg.collection]; if (list) { const i = list.findIndex((x) => x.id === msg.item.id); const item = { id: msg.item.id || "x" + Date.now(), points: 0, members: [], ...msg.item }; if (i >= 0) list[i] = { ...list[i], ...item }; else list.push(item); } return { item: msg.item }; }
    if (t === "delete") return {};
    if (t === "adjust") { m.points += msg.points; return { points: m.points }; }
    throw { message: "unknown " + msg.type };
  },
};
</script>
<script type="module">
  await import("../../custom_components/family/frontend/family-panel.js?v=" + Date.now());
  // ?mode=card: the Family card, as on a dashboard.
  const card = params.get("mode") === "card";
  const el = document.createElement(card ? "family-card" : "family-panel");
  if (card) el.setConfig({});
  else el.panel = { config: { mode: params.get("mode") || "family" } };
  el.narrow = window.innerWidth < 870;
  el.hass = window.hass;
  window.panel = el;
  document.body.appendChild(el);
</script>
</body></html>
