    if (t === "save" && msg.collection === "routines" && !(msg.item.steps || []).length) throw { message: "Give the routine at least one step" };
    if (t === "save") { const list = { chores: allChores, rewards, members, controls, routines }[msg.collection]; if (list) { const i = list.findIndex((x) => x.id === msg.item.id); const item = { id: msg.item.id || "x" + Date.now(), points: 0, members: [], ...msg.item }; if (msg.collection === "rewards" && !Object.hasOwn(msg.item, "members")) item.members = i >= 0 ? (list[i].members ?? null) : null; if (msg.collection === "rewards" && Array.isArray(item.members)) { const ids = members.map((m) => m.id); const known = item.members.filter((id) => ids.includes(id)); item.members = ids.length && known.length === ids.length ? null : known; } if (i >= 0) list[i] = { ...list[i], ...item }; else list.push(item); if (msg.collection === "rewards") { for (const person of members) { if (person.goal === item.id && item.members != null && !item.members.includes(person.id)) person.goal = null; } } } return { item: msg.item }; }
    if (t === "delete") { const list = { chores: allChores, rewards, members, controls, routines }[msg.collection]; const i = list ? list.findIndex((x) => x.id === msg.item_id) : -1; if (i >= 0) list.splice(i, 1); if (msg.collection === "members") { for (const reward of rewards) { if (Array.isArray(reward.members)) reward.members = reward.members.filter((id) => id !== msg.item_id); } for (const person of members) { const reward = rewards.find((r) => r.id === person.goal); if (person.goal && reward && reward.members != null && !reward.members.includes(person.id)) person.goal = null; } } if (msg.collection === "rewards") { for (const person of members) if (person.goal === msg.item_id) person.goal = null; } return {}; }
    if (t === "routine/step") {
      const r = routines.find((x) => x.id === msg.routine_id);
      if (!r) throw { message: "That routine isn't there any more" };
      const who = r.members.length ? r.members : members.map((x) => x.id);
      if (!who.includes(msg.member_id)) throw { message: `${r.name} isn't ${m.name}'s` };
      if (routineFinished(r.id, msg.member_id)) throw { message: `${m.name} already finished ${r.name}` };
      const ticked = new Set((routineSteps[r.id] ||= {})[msg.member_id] || []);
      if (msg.done) ticked.add(msg.step); else ticked.delete(msg.step);
      routineSteps[r.id][msg.member_id] = [...ticked].sort();
      const res = { ticked: routineSteps[r.id][msg.member_id] };
      if (ticked.size >= r.steps.length) {
        const entry = { id: "e" + Date.now(), at: new Date().toISOString(), kind: "chore", member: msg.member_id, title: r.name, points: r.points, routine_id: r.id, chore_id: "routine:" + r.id, review: "pending" };
        entries.push(entry); m.points += r.points; res.entry = entry;
      }
      return res;
    }
    if (t === "adjust") { m.points += msg.points; return { points: m.points }; }
    if (t === "hold") {
      if (msg.lift) { m.held_until = null; m.hold_reason = null; return { member: m }; }
      const now = new Date();
      let end;
      if (msg.until) { end = new Date(msg.until + "T00:00:00"); end.setDate(end.getDate() + 1); }
      else if (msg.days === 0) { end = new Date(now); end.setHours(24, 0, 0, 0); }
      else end = new Date(now.getTime() + msg.days * 86400000);
      if (end <= now) throw { message: "Pick a day that hasn't passed" };
      m.held_until = end.toISOString(); m.hold_reason = (msg.reason || "").trim() || null;
      return { member: m };
    }
    throw { message: "unknown " + msg.type };
  },
};
</script>
